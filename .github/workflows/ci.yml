name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Python (ruff)
        run: ruff check . && ruff format --check .
      - name: YAML (yamllint)
        run: yamllint .
      - name: Bash (shellcheck)
        run: |
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then shellcheck $files; else echo "Henüz .sh dosyası yok"; fi
      - name: Kural dosyaları geçerli mi?
        run: pytest -q
